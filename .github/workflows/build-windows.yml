name: Build Windows VST3 (JUCE, real MSVC)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Visual Studio 17 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --target BBKWavTap_VST3

      - name: Locate the built .vst3
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build -Recurse -Filter "BBK WavTap.vst3" | Select-Object -First 1
          if (-not $found) { throw "BBK WavTap.vst3 not found under build/ - build likely failed." }
          Write-Host "Found: $($found.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $found.FullName -Destination "dist/BBK WavTap.vst3" -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBK-WavTap-Windows-VST3-JUCE-MSVC
          path: dist/BBK WavTap.vst3
